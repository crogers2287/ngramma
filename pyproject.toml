[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ngramma-runtime"
version = "0.2.0"
description = "Sparse memory edit experiments and an offline response explorer"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
research = ["numpy>=1.26", "torch>=2.4"]
memory = ["numpy>=1.26"]
test = ["pytest>=8"]

[project.scripts]
ngramma-report = "ngramma_runtime.response_report:main"
ngramma-inspect = "ngramma_runtime.overlay_inspect:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ngramma_runtime*"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
ngramma_runtime = ["native/*.cpp"]
