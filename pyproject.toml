[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ngramma-runtime"
version = "0.1.0"
description = "Forward-only local diagnostics for the archived Ngramma experiment"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
research = ["numpy>=1.26", "torch>=2.4"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ngramma_runtime*"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.package-data]
ngramma_runtime = ["native/*.cpp"]
