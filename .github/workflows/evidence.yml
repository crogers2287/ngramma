name: Verify published research evidence
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify hashes, replay tool episodes, and check reported results
        run: |
          python3 scripts/verify_results.py
          python3 scripts/verify_parity_experiments.py
          python3 scripts/verify_attention_experiment.py
          python3 scripts/verify_row_response.py --local-only
      - name: Install lightweight test dependency
        run: python3 -m pip install 'pytest>=8,<10' 'numpy>=1.26,<3'
      - name: Check runtime configuration and safe imports
        run: python3 -m pytest -q tests
